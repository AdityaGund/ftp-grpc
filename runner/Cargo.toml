[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]
client = { path = "../client" }
destination = { path = "../destination" }
tokio = { version = "1", features = ["full"] }
actix-web = "4.11.0" 
watch = "0.2.3"
env_logger = "0.11.8"
notify = "8.0.0"
log = "0.4.17"
dotenv = "0.15.0"
tonic = { version = "0.11", features = ["transport"] }
tokio-stream = "0.1.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
