[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lib]
name = "client"
path = "src/lib.rs"

[dependencies]
tonic = {version = "0.13.1"}
prost = "0.13.5"
tokio = {version="1.45.1",features=["macros","rt-multi-thread","fs"]}
tokio-stream = { version = "0.1", features = ["sync"] }
uuid={version="1.10" , features=["v4","serde"]}
chrono = "0.4.41"
log = "0.4.27"
simplelog = "0.12.2"
dotenv = "0.15.0"
serde = {version = "1.0.219", features = ["derive"] }
actix-web = "4.11.0"
actix-multipart = "0.7.2"
futures-util = "0.3.31"
serde_json = "1.0.140"
actix-cors = "0.7.1"
async-stream = "=0.1.2"
bytes = "1"
mongodb = "3.2.3"
jsonwebtoken = "9.3.1"
argon2 = "0.5.3"
bson = "2.15.0"
futures = "0.3.31"
actix-web-httpauth = "0.8.2"
tokio-util = "0.7.15"

[build-dependencies]
tonic-build = "0.13.1"

