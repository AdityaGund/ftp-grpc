version: "3.9"

services:
  # ------------------ DATABASE ------------------
  # mongo:
  #   image: mongo:6
  #   container_name: ftp-grpc-mongo
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
  #   volumes:
  #     - mongo-data:/data/db
  #   ports:
  #     - "27017:27017"

  # ------------------ SERVER ------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ftp-grpc-server
    # depends_on:
    #   - mongo
    env_file:
      - ./server/.env
    volumes:
      # - ./server/.env:/app/server/.env:ro
      - ./keys/admin_public.pem:/app/keys/admin_public.pem:ro
      - ./keys/admin_private.pem:/app/keys/admin_private.pem:ro
    ports:
      - "50051:50051"  
      - "50052:50052"  

  # ------------------ RUNNER ------------------
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: ftp-grpc-runner
    depends_on:
      # - mongo
      - server
    env_file:
      - ./client/.env
      - ./destination/.env
    volumes:
      - ./keys/admin_public.pem:/app/keys/admin_public.pem:ro
    ports:
      - "8081:8081"    
      - "50053:50053"  

  frontend:
    build:
      context: ./frontend   
    container_name: ftp-grpc-frontend
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env

