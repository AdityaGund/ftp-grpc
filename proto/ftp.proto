syntax = "proto3";

package ftp;

service TransferService {
    rpc Transfer (stream Chunk) returns (TransferResponse);
}

message Chunk {
    oneof data {
        Metadata metadata = 1;   
        bytes content = 2;
    }
}

message Metadata {
    string transfer_id = 1;       
    string sender_id = 2;
    string receiver_id = 3;

    oneof payload_type {
        FileInfo file_info = 4;      
        MessageInfo message_info = 5;
    }
}

message FileInfo {
    string name = 1;
    uint64 size = 2; // Total size of the file in bytes
    string content_type = 3; // e.g., "image/jpeg", "application/pdf"
}

message MessageInfo {
    uint64 length = 1; 
}

message TransferResponse {
    string transfer_id = 1; 
    Status status = 2;
    string message = 3;     // e.g., "Successfully received by B", "Forwarded to C", "Error: C unavailable"
}

enum Status {
    SUCCESS = 0; 
    IN_PROGRESS = 1;                  
    FAILURE = 2;
}