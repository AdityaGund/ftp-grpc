[package]
name = "destination"
version = "0.1.0"
edition = "2024"

[lib]
name = "destination"
path = "src/lib.rs"

[dependencies]
tonic = "0.13.1"
prost = "0.13.5"
tokio = {version="1.45.1",features=["macros","rt-multi-thread","fs"]}
tokio-stream = { version = "0.1", features = ["sync"] }
uuid={version="1.10" , features=["v4","serde"]}
chrono = "0.4.41"
log = "0.4.27"
simplelog = "0.12.2"
dotenv = "0.15.0"
axum = "0.8.4"
actix-web = "4.11.0"
actix-cors = "0.7.1"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
mongodb = "3.2.3"
futures = "0.3.31"
bson = "2.15.0"
actix-multipart = "0.7.2"

[build-dependencies]
tonic-build = "0.13.1"

