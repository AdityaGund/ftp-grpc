[package]
name = "destination"
version = "0.1.0"
edition = "2024"

[lib]
name = "destination"
path = "src/lib.rs"

[dependencies]
tonic = "0.13.1"
prost = "0.13.5"
tokio = {version="1.45.1",features=["macros","rt-multi-thread","fs"]}
tokio-stream="0.1"
uuid={version="1.10" , features=["v4","serde"]}
chrono = "0.4.41"
log = "0.4.27"
simplelog = "0.12.2"
dotenv = "0.15.0"
axum = "0.8.4"

[build-dependencies]
tonic-build = "0.13.1"

